<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard | QuickMed</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    :root {
      --blue: #1d6cf1;
      --ink: #0c1b33;
      --ink-2: #334155;
      --ink-3: #64748b;
      --line: #e2e8f0;
      --surface: #f8faff;
      --white: #ffffff;
      --radius: 14px;
    }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--surface); color: var(--ink); margin: 0; }
    .container { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
    h1 { font-weight: 800; font-size: 28px; }
    .nav-logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 800; color: var(--blue); text-decoration: none; }
    .card { background: white; border-radius: var(--radius); border: 1.5px solid var(--line); padding: 24px; margin-bottom: 30px; }
    .card-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { text-align: left; padding: 12px; border-bottom: 2px solid var(--line); font-size: 13px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.5px; }
    td { padding: 14px 12px; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--ink-2); }
    tr:last-child td { border-bottom: none; }
    .badge { padding: 4px 10px; border-radius: 50px; font-size: 12px; font-weight: 600; }
    .badge-patient { background: #e0f2fe; color: #0369a1; }
    .badge-admin { background: #fef3c7; color: #92400e; }
    .badge-upcoming { background: #d1fae5; color: #065f46; }
    
    .btn-home { background: var(--blue); color: white; padding: 10px 20px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 14px; }
    
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: white; border-radius: var(--radius); border: 1.5px solid var(--line); padding: 20px; display: flex; align-items: center; gap: 15px; }
    .stat-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: white; }
    .stat-info .stat-val { font-size: 24px; font-weight: 800; }
    .stat-info .stat-lbl { font-size: 13px; color: var(--ink-3); }
    .bg-blue { background: #3b82f6; }
    .bg-green { background: #10b981; }
    .bg-amber { background: #f59e0b; }

    .search-wrapper { margin-bottom: 15px; position: relative; }
    .search-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
    .search-wrapper input { width: 100%; padding: 10px 10px 10px 35px; border: 1.5px solid var(--line); border-radius: 10px; outline: none; font-family: inherit; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <a href="index.html" class="nav-logo">
      <div class="icon" style="width:40px;height:40px;background:var(--blue);border-radius:10px;display:flex;align-items:center;justify-content:center;color:white;"><i class="fa-solid fa-stethoscope"></i></div>
      Quick<span>Med</span> Admin
    </a>
    <a href="index.html" class="btn-home">Back to Home</a>
  </header>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-icon bg-blue"><i class="fa-solid fa-calendar-check"></i></div>
      <div class="stat-info">
        <div class="stat-val" id="totalAppts">0</div>
        <div class="stat-lbl">Total Appointments</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon bg-green"><i class="fa-solid fa-users"></i></div>
      <div class="stat-info">
        <div class="stat-val" id="totalUsers">0</div>
        <div class="stat-lbl">Registered Patients</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon bg-amber"><i class="fa-solid fa-star"></i></div>
      <div class="stat-info">
        <div class="stat-val">4.9</div>
        <div class="stat-lbl">Average Rating</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-title"><i class="fa-solid fa-users"></i> Registered Users</div>
    <div class="search-wrapper">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="userSearch" placeholder="Search users by name or email...">
    </div>
    <table id="usersTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Role</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="4" style="text-align:center;">Loading users...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <div class="card-title"><i class="fa-solid fa-calendar-check"></i> All Appointments</div>
    <div class="search-wrapper">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="apptSearch" placeholder="Search appointments by patient or doctor...">
    </div>
    <table id="apptsTable">
      <thead>
        <tr>
          <th>Patient</th>
          <th>Doctor</th>
          <th>Date</th>
          <th>Time</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr><td colspan="5" style="text-align:center;">Loading appointments...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script type="module" src="firebase-config.js"></script>
<script>
  const API_URL = 'http://localhost:5000/api';

  async function loadData() {
    const user = JSON.parse(localStorage.getItem('quickmed_user'));
    if (!user || user.role !== 'admin') {
      alert('Access denied. Admin only.');
      window.location.href = 'index.html';
      return;
    }

    try {
      let users = null;
      let appts = null;

      // 1. Try Direct Firebase Firestore
      if (window.QuickMedFirebase) {
        try {
          const adminData = await window.QuickMedFirebase.getAdminData();
          users = adminData.users;
          appts = adminData.appointments;
        } catch (fbErr) {
          console.warn('Firebase admin direct fetch fallback to API:', fbErr);
        }
      }

      // 2. Fallback to Backend API
      if (!users || !appts) {
        // Load Users
        const uRes = await fetch(`${API_URL}/admin/users`);
        users = await uRes.json();
        
        // Load Appointments
        const aRes = await fetch(`${API_URL}/admin/appointments`);
        appts = await aRes.json();
      }

      // Update stats
      allUsers = users;
      allAppts = appts;
      renderUsers(users);
      renderAppts(appts);
      animateValue("totalAppts", 0, appts.length, 1000);
      animateValue("totalUsers", 0, users.length, 1000);

    } catch (err) {
      console.error(err);
      alert('Failed to load admin data. Ensure Firebase or backend is running.');
    }
  }

  let allUsers = [];
  let allAppts = [];

  function renderUsers(users) {
    document.querySelector('#usersTable tbody').innerHTML = users.map(u => `
      <tr>
        <td>${u.NAME}</td>
        <td>${u.EMAIL}</td>
        <td>${u.PHONE || 'N/A'}</td>
        <td><span class="badge badge-${u.ROLE}">${u.ROLE}</span></td>
      </tr>
    `).join('');
  }

  function renderAppts(appts) {
    document.querySelector('#apptsTable tbody').innerHTML = appts.map(a => `
      <tr>
        <td>${a.PATIENT_NAME || a.patient_name}</td>
        <td>${a.SPECIALIST || a.specialist}</td>
        <td>${new Date(a.DATE || a.date || a.APPT_DATE || a.appt_date).toDateString()}</td>
        <td>${a.TIME || a.time || a.TIME_SLOT || a.time_slot}</td>
        <td><span class="badge badge-upcoming">${a.STATUS || 'Upcoming'}</span></td>
      </tr>
    `).join('');
  }

  document.getElementById('userSearch').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    const filtered = allUsers.filter(u => 
      u.NAME.toLowerCase().includes(term) || u.EMAIL.toLowerCase().includes(term)
    );
    renderUsers(filtered);
  });

  document.getElementById('apptSearch').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    const filtered = allAppts.filter(a => 
      (a.PATIENT_NAME || a.patient_name || '').toLowerCase().includes(term) ||
      (a.SPECIALIST || a.specialist || '').toLowerCase().includes(term)
    );
    renderAppts(filtered);
  });

  function animateValue(id, start, end, duration) {
    const obj = document.getElementById(id);
    if (!obj) return;
    let startTimestamp = null;
    const step = (timestamp) => {
      if (!startTimestamp) startTimestamp = timestamp;
      const progress = Math.min((timestamp - startTimestamp) / duration, 1);
      obj.innerHTML = Math.floor(progress * (end - start) + start);
      if (progress < 1) {
        window.requestAnimationFrame(step);
      }
    };
    window.requestAnimationFrame(step);
  }

  document.addEventListener('DOMContentLoaded', loadData);
</script>

</body>
</html>
